[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurocode-ai"
version = "1.3.0"
description = "Heterogeneous Code-Graph Slicing & AST Subtree Grafting for On-Device Autonomous SWE Agents"
readme = "README.md"
authors = [{ name = "Deepak R." }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-go>=0.21.0",
    "tree-sitter-rust>=0.21.0",
    "networkx>=3.0",
    "datasets>=2.18.0",
    "matplotlib>=3.8.0",
    "transformers>=4.40.0"
]

[project.scripts]
neurocode = "src.cli:main"
neurocode-mcp = "src.mcp_server:main"
neurocode-copilot = "code_assistant:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
