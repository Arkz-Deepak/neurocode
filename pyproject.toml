[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurocode"
version = "0.1.0"
description = "Heterogeneous Code-Graph Slicing for On-Device Autonomous SWE Agents"
readme = "README.md"
authors = [{ name = "Deepak R." }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    "networkx>=3.0",
    "datasets>=2.18.0",
    "matplotlib>=3.8.0",
    "transformers>=4.40.0"
]

[project.scripts]
neurocode = "code_assistant:main"
